openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: teams
    description: Mentoring teams
  - name: access
    description: User permissions
  - name: mentors
    description: Available mentors
  - name: audit
    description: Administrator-only roster history
  - name: dashboard
    description: Aggregated mentoring metrics
paths:
  /roster-audit:
    get:
      operationId: getRosterAudit
      tags: [audit]
      summary: View recent roster changes, optionally filtered by team or student ID
      parameters:
        - name: teamId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: studentId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: mentorId
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Most recent 100 changes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterAuditEvent"
        "400":
          description: Invalid filter
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Server health check
      description: Returns whether the API process is available
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStatus"
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Check API and database connection
      responses:
        "200":
          description: API and database are connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get aggregated mentoring metrics
      description: >-
        Aggregates every mentoring session. The network openness rate is the
        percentage of sessions led by mentors whose type is external. Averages
        and rate are rounded to one decimal place; all metrics are zero when
        there are no sessions.
      responses:
        "200":
          description: Aggregated dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Sign in required
        "403":
          description: Approved Hub access required
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teams:
    get:
      operationId: getTeams
      tags: [teams]
      summary: List mentoring teams
      description: Returns each team with its lead mentor, ordered students, and session count.
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team with its initial students
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Invalid team data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "409":
          description: Team name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teams/{teamId}:
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update a team name or its main mentor
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdateInput"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          description: Invalid team data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Team not found
        "409":
          description: Team name already exists or team changed since it was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete a team and its students
      description: Teams with recorded mentoring sessions cannot be deleted.
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamDeleteInput"
      responses:
        "204":
          description: Team deleted
        "400":
          description: Invalid deletion confirmation
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Team not found
        "409":
          description: Team has mentoring sessions or changed since confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teams/{teamId}/students:
    post:
      operationId: createStudent
      tags: [teams]
      summary: Add a student to a team
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Student added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Invalid student data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Team not found
  /teams/{teamId}/sessions:
    get:
      operationId: getTeamSessions
      tags: [teams]
      summary: Retrieve the complete session history for a team
      description: Returns every session in reverse chronological order, including the conducting mentor, all scores, and complete qualitative notes.
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Complete session history, newest session first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamSessionHistoryItem"
        "400":
          description: Invalid team identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
        "403":
          description: Approved user access required
        "404":
          description: Team not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMentoringSession
      tags: [teams]
      summary: Record a mentoring session for a team
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentoringSessionInput"
      responses:
        "201":
          description: Mentoring session recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentoringSession"
        "400":
          description: Invalid session data or unavailable mentor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Team not found
  /teams/{teamId}/students/{studentId}:
    patch:
      operationId: updateStudent
      tags: [teams]
      summary: Update a student's name
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdateInput"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Invalid student data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Team or student not found
        "409":
          description: Student changed since it was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStudent
      tags: [teams]
      summary: Remove a student from a team
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentDeleteInput"
      responses:
        "204":
          description: Student deleted
        "400":
          description: Invalid deletion confirmation
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "404":
          description: Team or student not found
        "409":
          description: Student changed since confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /mentors:
    get:
      operationId: getMentors
      tags: [mentors]
      summary: List mentors available for team assignment
      responses:
        "200":
          description: Mentors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentorOption"
        "401":
          description: Sign in required
        "403":
          description: Approved access required
    post:
      operationId: createMentor
      tags: [mentors]
      summary: Register a mentor
      description: Administrator-only. New mentors are added to the roster and recorded in its audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorInput"
      responses:
        "201":
          description: Mentor registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorOption"
        "400":
          description: Invalid mentor data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Sign in required
        "403":
          description: Administrator access required
        "409":
          description: A mentor with this email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /access:
    get:
      operationId: getAccessPermissions
      tags: [access]
      summary: Get current user's safe access capabilities
      responses:
        "200":
          description: Access capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPermissions"
        "401":
          description: Sign in required
        "403":
          description: Approved access required
components:
  schemas:
    RosterAuditEvent:
      type: object
      properties:
        id: { type: integer }
        teamId: { type: ["integer", "null"] }
        studentId: { type: ["integer", "null"] }
        mentorId: { type: ["integer", "null"] }
        action: { type: string }
        actorEmail: { type: string }
        summary: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, teamId, studentId, mentorId, action, actorEmail, summary, createdAt]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    AccessPermissions:
      type: object
      properties:
        canManage:
          type: boolean
      required: [canManage]
    MentorOption:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
          format: email
        expertiseArea:
          type: ["string", "null"]
        mentorType:
          type: ["string", "null"]
          enum: [interno, externo, null]
        totalSessions:
          type: integer
          minimum: 0
          description: Total mentoring sessions conducted by this mentor.
        avgNpsReceived:
          type: ["number", "null"]
          minimum: 0
          maximum: 10
          description: Mean team NPS for this mentor, or null when there are no sessions.
        assignedTeamsCount:
          type: integer
          minimum: 0
          description: Number of distinct teams mentored.
      required:
        - id
        - name
        - email
        - expertiseArea
        - mentorType
        - totalSessions
        - avgNpsReceived
        - assignedTeamsCount
    MentorInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: ["string", "null"]
          format: email
        expertiseArea:
          type: ["string", "null"]
          minLength: 1
          maxLength: 120
        mentorType:
          type: ["string", "null"]
          enum: [interno, externo, null]
      required: [name]
    ServerStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required:
        - status
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [connected, disconnected]
      required:
        - status
        - database
    Mentor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        expertiseArea:
          type: ["string", "null"]
        mentorType:
          type: ["string", "null"]
          enum: [interno, externo, null]
      required:
        - id
        - name
        - email
        - expertiseArea
        - mentorType
    Student:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sortOrder:
          type: integer
          minimum: 0
      required:
        - id
        - name
        - sortOrder
    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        pitchSummary:
          type: ["string", "null"]
        currentStage:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        mainMentor:
          $ref: "#/components/schemas/Mentor"
        students:
          type: array
          items:
            $ref: "#/components/schemas/Student"
        sessionCount:
          type: integer
          minimum: 0
          description: Backward-compatible session total; equivalent to totalSessions.
        totalSessions:
          type: integer
          minimum: 0
        transversalSessionCount:
          type: integer
          minimum: 0
        lastSessionDate:
          type: ["string", "null"]
          format: date
          description: Calendar date of the most recent session, or null when there are no sessions.
        lastSessionScore:
          type: ["integer", "null"]
          minimum: 0
          maximum: 10
          description: Team NPS for the most recent session, or null when there are no sessions.
        latestAgreedNextSteps:
          type: ["string", "null"]
          description: Agreed next steps from the most recent session, or null when there are no sessions.
      required:
        - id
        - name
        - pitchSummary
        - currentStage
        - createdAt
        - mainMentor
        - students
        - sessionCount
        - totalSessions
        - transversalSessionCount
        - lastSessionDate
        - lastSessionScore
        - latestAgreedNextSteps
    TeamInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        mainMentorId:
          type: integer
          minimum: 1
        students:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
      required: [name, mainMentorId, students]
    TeamUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        mainMentorId:
          type: integer
          minimum: 1
        expectedName:
          type: string
          minLength: 1
          maxLength: 120
        expectedMainMentorId:
          type: integer
          minimum: 1
      required: [expectedName, expectedMainMentorId]
    MentoringSession:
      type: object
      properties:
        id:
          type: integer
        teamId:
          type: integer
        mentorId:
          type: integer
        sessionType:
          type: string
          enum: [principal, transversal, externo]
        sessionDate:
          type: string
          format: date
        teamNps:
          type: integer
          minimum: 0
          maximum: 10
        teamActionability:
          type: integer
          minimum: 0
          maximum: 10
        mentorCommitment:
          type: integer
          minimum: 0
          maximum: 10
        mentorTraction:
          type: integer
          minimum: 0
          maximum: 10
        teamFeedbackStrongPoints:
          type: string
        teamFeedbackImprovements:
          type: string
        agreedNextSteps:
          type: string
        mentorQualitativeAssessment:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - teamId
        - mentorId
        - sessionType
        - sessionDate
        - teamNps
        - teamActionability
        - mentorCommitment
        - mentorTraction
        - teamFeedbackStrongPoints
        - teamFeedbackImprovements
        - agreedNextSteps
        - mentorQualitativeAssessment
        - createdAt
    TeamSessionHistoryItem:
      type: object
      properties:
        id:
          type: integer
        sessionDate:
          type: string
          format: date
        sessionType:
          type: string
          enum: [principal, transversal, externo]
        mentor:
          $ref: "#/components/schemas/TeamSessionMentor"
        scores:
          $ref: "#/components/schemas/TeamSessionScores"
        qualitative:
          $ref: "#/components/schemas/TeamSessionQualitative"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sessionDate
        - sessionType
        - mentor
        - scores
        - qualitative
        - createdAt
    TeamSessionMentor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        expertiseArea:
          type: ["string", "null"]
        mentorType:
          type: ["string", "null"]
          enum: [interno, externo, null]
      required: [id, name, expertiseArea, mentorType]
    TeamSessionScores:
      type: object
      properties:
        teamNps:
          type: integer
          minimum: 0
          maximum: 10
        teamActionability:
          type: integer
          minimum: 0
          maximum: 10
        mentorCommitment:
          type: integer
          minimum: 0
          maximum: 10
        mentorTraction:
          type: integer
          minimum: 0
          maximum: 10
      required: [teamNps, teamActionability, mentorCommitment, mentorTraction]
    TeamSessionQualitative:
      type: object
      properties:
        teamFeedbackStrongPoints:
          type: string
        teamFeedbackImprovements:
          type: string
        agreedNextSteps:
          type: string
        mentorQualitativeAssessment:
          type: string
      required:
        - teamFeedbackStrongPoints
        - teamFeedbackImprovements
        - agreedNextSteps
        - mentorQualitativeAssessment
    MentoringSessionInput:
      type: object
      properties:
        mentorId:
          type: integer
          minimum: 1
        sessionType:
          type: string
          enum: [principal, transversal, externo]
        sessionDate:
          type: string
          format: date
        teamNps:
          type: integer
          minimum: 0
          maximum: 10
        teamActionability:
          type: integer
          minimum: 0
          maximum: 10
        mentorCommitment:
          type: integer
          minimum: 0
          maximum: 10
        mentorTraction:
          type: integer
          minimum: 0
          maximum: 10
        teamFeedbackStrongPoints:
          type: string
          minLength: 1
          maxLength: 5000
        teamFeedbackImprovements:
          type: string
          minLength: 1
          maxLength: 5000
        agreedNextSteps:
          type: string
          minLength: 1
          maxLength: 5000
        mentorQualitativeAssessment:
          type: string
          minLength: 1
          maxLength: 5000
      required:
        - mentorId
        - sessionType
        - sessionDate
        - teamNps
        - teamActionability
        - mentorCommitment
        - mentorTraction
        - teamFeedbackStrongPoints
        - teamFeedbackImprovements
        - agreedNextSteps
        - mentorQualitativeAssessment
    StudentSnapshot:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        sortOrder:
          type: integer
          minimum: 0
      required: [id, name, sortOrder]
    TeamDeleteInput:
      type: object
      properties:
        expectedName:
          type: string
          minLength: 1
          maxLength: 120
        expectedMainMentorId:
          type: integer
          minimum: 1
        expectedStudents:
          type: array
          items:
            $ref: "#/components/schemas/StudentSnapshot"
      required: [expectedName, expectedMainMentorId, expectedStudents]
    StudentInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required: [name]
    StudentUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        expectedName:
          type: string
          minLength: 1
          maxLength: 200
      required: [name, expectedName]
    StudentDeleteInput:
      type: object
      properties:
        expectedName:
          type: string
          minLength: 1
          maxLength: 200
      required: [expectedName]
    DashboardStats:
      type: object
      properties:
        totalSessions:
          type: integer
          minimum: 0
        avgNps:
          type: number
          minimum: 0
          maximum: 10
        avgTraction:
          type: number
          minimum: 0
          maximum: 10
        networkOpennessRate:
          type: number
          minimum: 0
          maximum: 100
      required: [totalSessions, avgNps, avgTraction, networkOpennessRate]

