kind = "web"
previewPath = "/"
title = "HUB de Mentorias PIBEP PUCPR"
description = "Relação oficial de mentores, equipes e estudantes do PIBEP 2026, 16ª edição, no Hub de Mentorias PIBEP PUCPR."
version = "1.0.0"
id = "artifacts/hub-mentorias"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21964

[services.development]
run = "pnpm --filter @workspace/hub-mentorias run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hub-mentorias", "run", "build" ]
serve = "static"
publicDir = "artifacts/hub-mentorias/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21964"
BASE_PATH = "/"
