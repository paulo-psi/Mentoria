name: Validate workflows and release scripts

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  lint:
    name: Lint GitHub Actions workflows and release scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint GitHub Actions workflows
        run: "$(go env GOPATH)/bin/actionlint"
      - name: Confirm malformed workflows are rejected
        run: ACTIONLINT_BIN="$(go env GOPATH)/bin/actionlint" node --test .github/workflows/actionlint-negative.test.mjs
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint release shell scripts
        run: shellcheck .github/scripts/*.sh